name: Build KurdiKeyboard and deploy Vercel from ZIP - DEX TRACE V3

on:
  push:
    branches: [ main, master ]
    paths:
      - project.zip
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      native_ime_preview:
        description: Build a native IME APK artifact without publishing it
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: kurdikeyboard-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK (Debug)
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: build-source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify diagnostic ZIP version
        working-directory: ${{ github.workspace }}
        run: |
          echo 'DEX TRACE V3'
          echo 'b519963d39b52ee3c5c8aa5fc697161d2742c4f99ea6532bb6e6d70dd7389dfd  project.zip' | sha256sum -c -

      - name: Extract and validate project.zip
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path, PurePosixPath
          import shutil, stat, tempfile, zipfile

          archive = Path('project.zip')
          if not archive.is_file():
              raise SystemExit('Upload project.zip at the repository root.')
          required = ('package.json', 'native-android/app/build.gradle',
                      'scripts/setup-android-ime.mjs', 'android-ime/KurdiKeyboardImeService.java',
                      'tests/keyboard-stability.test.mjs', 'tests/ImeOperationGateTest.java')
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              with zipfile.ZipFile(archive) as z:
                  entries = z.infolist()
                  if len(entries) > 30000 or sum(e.file_size for e in entries) > 1024**3:
                      raise SystemExit('ZIP exceeds extraction limits.')
                  seen = set()
                  for e in entries:
                      path = PurePosixPath(e.filename)
                      if (path.is_absolute() or '..' in path.parts or '\\' in e.filename
                          or ':' in path.parts[0] or '.git' in path.parts
                          or stat.S_ISLNK(e.external_attr >> 16)):
                          raise SystemExit('Unsafe ZIP entry: ' + e.filename)
                      if path in seen:
                          raise SystemExit('Duplicate ZIP entry: ' + e.filename)
                      seen.add(path)
                  z.extractall(root)
              candidates = [f.parent for f in root.rglob('package.json')
                            if all((f.parent / x).is_file() for x in required)
                            and 'node_modules' not in f.relative_to(root).parts]
              if len(candidates) != 1:
                  raise SystemExit('ZIP must contain exactly one complete Native Android project.')
              target = Path('build-source')
              if target.exists() or target.is_symlink():
                  raise SystemExit('Remove the reserved build-source directory from the repository.')
              shutil.copytree(candidates[0], target, ignore=shutil.ignore_patterns('node_modules', 'dist', 'android', '__MACOSX'))
          print('Project extracted and validated.')
          PYTHON

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run keyboard stability unit tests
        run: |
          node --experimental-strip-types --test tests/keyboard-stability.test.mjs
          mkdir -p /tmp/ime-test
          javac -d /tmp/ime-test android-ime/ImeOperationGate.java android-ime/ImeTailRequests.java tests/ImeOperationGateTest.java
          java -cp /tmp/ime-test io.kurdikebord.app.ImeOperationGateTest
          javac -encoding UTF-8 -d /tmp/ime-test android-ime/ImeLargeText.java tests/ImeLargeTextTest.java
          java -cp /tmp/ime-test io.kurdikebord.app.ImeLargeTextTest

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: Test native IME data and text algorithms
        run: node --test tests/native-ime-engine.test.mjs

      - name: Set up standalone Android build tools
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: 'true'

      - name: Verify Android SDK installation
        run: |
          command -v sdkmanager
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"

      - name: Test native vector paths
        run: python3 tests/test-native-path-parser.py

      - name: Prepare offline Facebook emoji from release font
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FACEBOOK_FONT_AUTHORIZED: ${{ vars.FACEBOOK_FONT_AUTHORIZED }}
        run: |
          if [ "$FACEBOOK_FONT_AUTHORIZED" != "true" ]; then
            echo "::error::Set repository variable FACEBOOK_FONT_AUTHORIZED=true only if you have permission to package the Facebook font artwork."
            exit 1
          fi
          if ! python3 -c 'import ctypes.util; assert ctypes.util.find_library("harfbuzz")'; then
            sudo apt-get update
            sudo apt-get install -y libharfbuzz0b
          fi
          font_dir="$(mktemp -d)"
          trap 'rm -rf "$font_dir"' EXIT
          gh release download latest-apk --repo Whiteheart00/Kurdishkeyboard --pattern 'Facebook15.0.ttf' --dir "$font_dir"
          python3 -m venv "$font_dir/venv"
          "$font_dir/venv/bin/python" -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'fonttools>=4.55,<5'
          "$font_dir/venv/bin/python" scripts/prepare-facebook-font.py "$font_dir/Facebook15.0.ttf" --authorized

      - name: Native source audit
        run: python3 scripts/audit-native.py --require-facebook

      - name: Restore Firebase configuration from GitHub Secrets
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          umask 077
          python3 - <<'PYTHON'
          import os, json
          from pathlib import Path
          raw = os.environ.get('FIREBASE_GOOGLE_SERVICES_JSON', '')
          if not raw:
              raise SystemExit('Missing repository secret FIREBASE_GOOGLE_SERVICES_JSON.')
          try:
              config = json.loads(raw)
              clients = [c for c in config['client'] if c['client_info']['android_client_info']['package_name'] == 'io.kurdikebord.app']
              assert len(clients) == 1
              assert config['project_info']['project_id'] == 'gen-lang-client-0732467678'
              assert any(c.get('client_type') == 3 for c in clients[0]['oauth_client'])
              assert any(c.get('client_type') == 1 and c.get('android_info', {}).get('certificate_hash', '').lower() == '244c6bcee7fe5a1fb892c080cb98f74ccd329f66' for c in clients[0]['oauth_client'])
              assert clients[0]['api_key'][0]['current_key']
          except (ValueError, KeyError, TypeError, AssertionError, IndexError):
              raise SystemExit('Invalid Firebase configuration, package, project or OAuth signing certificate.') from None
          target = Path('native-android/app/google-services.json')
          target.write_text(json.dumps(config), encoding='utf-8')
          target.chmod(0o600)
          print('Firebase configuration validated (values not printed).')
          PYTHON

      - name: Restore persistent signing keystore from GitHub Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64; keep the existing private signing key."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-ime/kurdikeyboard-debug.keystore
          test -s android-ime/kurdikeyboard-debug.keystore

      - name: Generate standalone Android project and preserve signing
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          NATIVE_IME_PREVIEW: '1'
        run: |
          # New workflow has its own run counter. Reserve a higher version range.
          export APP_VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))
          node scripts/setup-android-ime.mjs

      - name: Verify Persistent APK Signing Keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          PASS="${ANDROID_KEYSTORE_PASSWORD:-android}"
          keytool -list -keystore android/app/kurdikeyboard-debug.keystore -storepass "$PASS"

      - name: Build Android Debug APK (In-Place Updatable)
        working-directory: ${{ github.workspace }}/build-source/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon
          gradle assembleDebug --no-daemon

      - name: Verify APK signature
        run: |
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk

      - name: DEX TRACE V3 - exact types and library owners
        run: |
          echo 'DEX TRACE V3 - before strict audit'
          python3 - <<'PYTHON'
          import re, zipfile
          apk = 'android/app/build/outputs/apk/debug/app-debug.apk'
          markers = (b'Landroid/webkit/', b'Landroidx/webkit/', b'Lcom/getcapacitor/', b'android.webkit.WebView')
          with zipfile.ZipFile(apk) as z:
              for name in z.namelist():
                  if not re.fullmatch(r'classes[0-9]*\.dex', name):
                      continue
                  data = z.read(name)
                  for marker in markers:
                      count = data.count(marker)
                      if count:
                          print(f'{name}: {marker.decode()} occurrences={count}')
                  for value in sorted(set(re.findall(rb'L(?:android/webkit|androidx/webkit|com/getcapacitor)/[A-Za-z0-9_$/]+;', data))):
                      print('EXACT TYPE:', value.decode('ascii'))
          PYTHON
          python3 -u scripts/diagnose-webkit.py android/app/build/outputs/apk/debug/app-debug.apk \
            --dexdump "$ANDROID_HOME/build-tools/34.0.0/dexdump" \
            --mapping android/app/build/outputs/mapping/debug/mapping.txt \
            --cache "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1"

      - name: Strict APK audit - V3 - before publication
        id: native_apk_audit
        run: python3 -u scripts/audit-native.py --require-facebook android/app/build/outputs/apk/debug/app-debug.apk


      - name: Prepare APK file
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/KurdiKeyboard-debug.apk

      - name: Publish APK to GitHub Releases (No Storage Limit)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.native_ime_preview }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk release-apk/KurdiKeyboard-debug.apk --clobber
          else
            gh release create latest-apk release-apk/KurdiKeyboard-debug.apk \
              --title "KurdiKeyboard Android APK (Latest)" \
              --notes "تەختەکلیلی کوردی — فایلی ئەندرۆید (APK) بە پشتگیری Direct Boot و ١٠ فۆنتە کوردییەکە."
          fi

      - name: Upload KurdiKeyboard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ${{ (github.event_name != 'workflow_dispatch' || inputs.native_ime_preview) && 'KurdiKeyboard-Native-Preview-APK' || 'KurdiKeyboard-APK' }}
          path: build-source/release-apk/KurdiKeyboard-debug.apk
          retention-days: 7

  deploy-vercel:
    name: Deploy Vercel Web & AI API (Production)
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.native_ime_preview && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Vercel configuration
        working-directory: ${{ github.workspace }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key"
              exit 1
            fi
          done

      - name: Extract and validate project.zip
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path, PurePosixPath
          import os, shutil, stat, tempfile, zipfile

          archive = Path('project.zip')
          if not archive.is_file():
              raise SystemExit('Upload project.zip at the repository root.')
          required = ('package.json', 'native-android/app/build.gradle',
                      'scripts/setup-android-ime.mjs', 'android-ime/KurdiKeyboardImeService.java',
                      'tests/keyboard-stability.test.mjs', 'tests/ImeOperationGateTest.java')
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              with zipfile.ZipFile(archive) as z:
                  entries = z.infolist()
                  if len(entries) > 30000 or sum(e.file_size for e in entries) > 1024**3:
                      raise SystemExit('ZIP exceeds extraction limits.')
                  seen = set()
                  for e in entries:
                      path = PurePosixPath(e.filename)
                      if (path.is_absolute() or '..' in path.parts or '\\' in e.filename
                          or ':' in path.parts[0] or '.git' in path.parts
                          or stat.S_ISLNK(e.external_attr >> 16)):
                          raise SystemExit('Unsafe ZIP entry: ' + e.filename)
                      if path in seen:
                          raise SystemExit('Duplicate ZIP entry: ' + e.filename)
                      seen.add(path)
                  z.extractall(root)
              candidates = [f.parent for f in root.rglob('package.json')
                            if all((f.parent / x).is_file() for x in required)
                            and 'node_modules' not in f.relative_to(root).parts]
              if len(candidates) != 1:
                  raise SystemExit('ZIP must contain exactly one complete Native Android project.')
              target = Path(os.environ['RUNNER_TEMP']) / 'kurdi-vercel-source'
              if target.exists() or target.is_symlink():
                  raise SystemExit('Vercel staging directory already exists.')
              shutil.copytree(candidates[0], target, ignore=shutil.ignore_patterns('node_modules', 'dist', 'android', 'android-ime', 'native-android', '.github', '.vercel', '__MACOSX'))
          print('Project extracted and validated.')
          PYTHON

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        working-directory: ${{ runner.temp }}/kurdi-vercel-source
        run: npm install --global vercel@latest

      - name: Configure web build from extracted source
        working-directory: ${{ runner.temp }}/kurdi-vercel-source
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          // Explicit install command: do not depend on the ZIP-only repository or bun.lock.
          config.installCommand = 'npm install --legacy-peer-deps --include=dev';
          config.buildCommand = 'npm run build';
          config.outputDirectory = 'dist';
          fs.writeFileSync('vercel.json', JSON.stringify(config, null, 2) + '\n');
          JS

      - name: Pull existing Vercel project and production environment
        working-directory: ${{ runner.temp }}/kurdi-vercel-source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vite and serverless API for Vercel
        working-directory: ${{ runner.temp }}/kurdi-vercel-source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel build --prod --token="$VERCEL_TOKEN"
          test -f .vercel/output/config.json
          test -d .vercel/output/static
          test -d .vercel/output/functions
          if ! find .vercel/output/functions -type d -name '*.func' -print -quit | grep -q .; then
            echo "::error::No serverless functions produced by Vercel build."
            exit 1
          fi

      - name: Deploy prebuilt output to existing Vercel production project
        working-directory: ${{ runner.temp }}/kurdi-vercel-source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
