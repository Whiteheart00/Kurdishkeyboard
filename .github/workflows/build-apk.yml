name: Build KurdiKeyboard Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite web bundle
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Install Capacitor 6 for Android
        run: npm install --no-save --legacy-peer-deps @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0

      - name: Generate Android project & sync web assets
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Inject Native Kurdish IME Service (Direct Boot Aware)
        run: node scripts/setup-android-ime.mjs

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK file
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/KurdiKeyboard-debug.apk

      - name: Publish APK to GitHub Releases (No Storage Limit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk release-apk/KurdiKeyboard-debug.apk --clobber
          else
            gh release create latest-apk release-apk/KurdiKeyboard-debug.apk \
              --title "KurdiKeyboard Android APK (Latest)" \
              --notes "تەختەکلیلی کوردی — فایلی ئەندرۆید (APK) بە پشتگیری Direct Boot و ١٠ فۆنتە کوردییەکە."
          fi

      - name: Upload KurdiKeyboard APK Artifact (Optional)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: KurdiKeyboard-APK
          path: release-apk/KurdiKeyboard-debug.apk
          retention-days: 1
